name: Deploy site redesigns to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "pleasant-valley-log-cabins/**"
      - "dave-illgs-collision-repair-center/**"
      - "whispering-pines-resort/**"
      - "frontier-lodge/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        # Publishes the portfolio landing page plus each site's finished
        # redesign only — the raw source/ crawl archives (scraped HTML,
        # full-size photo dumps, crawl logs) stay out of the public deploy.
        run: |
          mkdir -p dist
          cp index.html dist/
          rsync -a --exclude=source pleasant-valley-log-cabins/ dist/pleasant-valley-log-cabins/
          rsync -a --exclude=source dave-illgs-collision-repair-center/ dist/dave-illgs-collision-repair-center/
          rsync -a --exclude=source whispering-pines-resort/ dist/whispering-pines-resort/
          rsync -a --exclude=source frontier-lodge/ dist/frontier-lodge/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
